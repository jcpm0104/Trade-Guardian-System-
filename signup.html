<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Trade Guardian System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBz0NnKwT50FJdE7E2qp8D6xvnRI9tLrq8",
      authDomain: "trade-guardian-system.firebaseapp.com",
      projectId: "trade-guardian-system",
      storageBucket: "trade-guardian-system.firebasestorage.app",
      messagingSenderId: "1034103501739",
      appId: "1:1034103501739:web:55b971e5d4c7a416d658ee"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.signup = async function () {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const status = document.getElementById("status");

      status.textContent = "";

      if (!email || !password) {
        status.textContent = "Please enter your email and password.";
        return;
      }

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        window.location.href = "dashboard.html";
      } catch (error) {
        status.textContent = "Unable to create your account. Please try again.";
      }
    };
  </script>

  <style>
    :root{
      --bg:#08111f;
      --panel:#101b2d;
      --line:rgba(255,255,255,.08);
      --text:#eaf1ff;
      --muted:#97a7c0;
      --blue:#2f6bff;
      --shadow:0 24px 60px rgba(0,0,0,.32);
      --max:920px;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:'Inter',system-ui,sans-serif;
      background:
        radial-gradient(circle at top left, rgba(47,107,255,.16), transparent 28%),
        radial-gradient(circle at bottom right, rgba(121,163,255,.10), transparent 22%),
        linear-gradient(180deg, #08111f 0%, #091321 100%);
      color:var(--text);
      min-height:100vh;
      padding:18px;
    }

    a{color:inherit;text-decoration:none}

    .shell{
      width:min(var(--max), 100%);
      margin:0 auto;
      min-height:calc(100vh - 36px);
      border-radius:34px;
      border:1px solid rgba(255,255,255,.08);
      background:
        radial-gradient(circle at top right, rgba(47,107,255,.18), transparent 25%),
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .content{
      padding:46px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:18px;
      margin-bottom:30px;
    }

    .brand-logo{
      width:72px;
      height:72px;
      border-radius:22px;
      display:grid;
      place-items:center;
      background:linear-gradient(180deg, rgba(47,107,255,.18), rgba(47,107,255,.08));
      border:1px solid rgba(255,255,255,.08);
      flex:0 0 72px;
    }

    .brand-name{
      font-size:28px;
      font-weight:800;
      line-height:1.06;
    }

    .brand-sub{
      font-size:15px;
      color:#a9b7cf;
      font-weight:700;
      letter-spacing:.14em;
      text-transform:uppercase;
      margin-top:3px;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 18px;
      border-radius:999px;
      background:rgba(255,255,255,.03);
      border:1px solid var(--line);
      color:#d7e2ff;
      font-size:15px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:26px;
    }

    .eyebrow::before{
      content:"";
      width:12px;
      height:12px;
      border-radius:999px;
      background:var(--blue);
      box-shadow:0 0 18px rgba(47,107,255,.55);
    }

    h1{
      font-size:clamp(40px, 6vw, 72px);
      line-height:1.02;
      letter-spacing:-0.04em;
      max-width:780px;
      margin-bottom:18px;
    }

    .lead{
      color:#a9b7cf;
      font-size:clamp(20px, 2.4vw, 27px);
      line-height:1.45;
      max-width:760px;
      margin-bottom:34px;
    }

    .cards{
      display:grid;
      gap:18px;
    }

    .card{
      border-radius:24px;
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.06);
      padding:26px 28px;
    }

    .field label{
      display:block;
      color:#eef3ff;
      font-size:16px;
      font-weight:700;
      margin-bottom:12px;
    }

    .field input{
      width:100%;
      height:62px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      background:#0c1728;
      color:#fff;
      padding:0 18px;
      font-size:17px;
      outline:none;
    }

    .field input::placeholder{
      color:rgba(255,255,255,.38);
    }

    .field input:focus{
      border-color:rgba(121,163,255,.7);
      box-shadow:0 0 0 3px rgba(47,107,255,.14);
    }

    .submit-row{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .btn{
      min-height:58px;
      border-radius:16px;
      border:none;
      background:linear-gradient(180deg, #4d82ff 0%, var(--blue) 100%);
      color:#fff;
      font-weight:700;
      font-size:17px;
      cursor:pointer;
      box-shadow:0 14px 30px rgba(47,107,255,.22);
      transition:.2s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
      filter:brightness(1.04);
    }

    .status{
      min-height:22px;
      color:#ffb6b6;
      font-size:14px;
      line-height:1.5;
    }

    .footer-links{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
      margin-top:18px;
      color:#cbd7ee;
      font-size:15px;
    }

    .footer-links a:hover{
      color:#fff;
    }

    @media (max-width: 760px){
      .content{
        padding:28px 22px;
      }

      .brand{
        gap:14px;
        margin-bottom:24px;
      }

      .brand-logo{
        width:58px;
        height:58px;
        border-radius:18px;
        flex-basis:58px;
      }

      .brand-name{
        font-size:22px;
      }

      .brand-sub{
        font-size:13px;
      }

      .eyebrow{
        font-size:13px;
        padding:9px 14px;
      }

      .card{
        padding:20px 18px;
      }

      .field input{
        height:56px;
        font-size:16px;
      }

      .btn{
        min-height:54px;
        font-size:16px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="content">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L19 5V11.2C19 16.1 15.95 19.35 12 21C8.05 19.35 5 16.1 5 11.2V5L12 2Z" fill="#2F6BFF"/>
            <path d="M8 13L10.2 10.5L12.4 12.1L16 8.2" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Trade Guardian</div>
          <div class="brand-sub">System</div>
        </div>
      </div>

      <div class="eyebrow">New Account</div>

      <h1>Create your account and start building your structure.</h1>

      <p class="lead">
        Thank you for choosing Trade Guardian.
      </p>

      <div class="cards">
        <div class="card field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="Enter your email">
        </div>

        <div class="card field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Create your password">
        </div>

        <div class="card submit-row">
          <button class="btn" onclick="signup()">Create Account</button>
          <div class="status" id="status"></div>
        </div>
      </div>

      <div class="footer-links">
        <a href="auth.html">← Back</a>
        <a href="signin.html">Sign In</a>
      </div>
    </div>
  </div>
</body>
</html>
